services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    container_name: tailscale
    hostname: nas-tailscale
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    command: tailscaled
    networks:
      - web
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # --- VPN & Download Stack ---
  gluetun:
    image: qmcgaw/gluetun:v3.39.1
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp" # HTTP proxy
      - "8388:8388/tcp" # Shadowsocks
      - "8090:8080/tcp" # qBittorrent WebUI
    volumes:
      - ./gluetun:/gluetun
      - ./gluetun/wireguard/wg0.conf:/gluetun/wireguard/wg0.conf:ro
      - ./config/qbittorrent:/config/qBittorrent
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - WIREGUARD_MTU=1280
      - FIREWALL_INPUT_PORTS=8080
      - FIREWALL_OUTBOUND_SUBNETS=172.18.0.0/16,172.19.0.0/16,192.168.0.0/16
      - FIREWALL_VPN_INPUT_PORTS=8080
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
      - HEALTH_TARGET_ADDRESS=1.1.1.1:443
      - HEALTH_VPN_DURATION_INITIAL=30s
      - HEALTH_VPN_DURATION_ADDITION=10s
      - HEALTH_SUCCESS_WAIT_DURATION=10s
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/user/data:/data
    network_mode: "service:gluetun"
    restart: always
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # --- Arr Management Stack ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./config/sonarr:/config
      - /mnt/user/Media/TV:/tv
      - /mnt/user/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./config/radarr:/config
      - /mnt/user/Media/Movies:/movies
      - /mnt/user/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./config/bazarr:/config
      - /mnt/user/Media/TV:/tv
      - /mnt/user/Media/Movies:/movies
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    volumes:
      - /mnt/user/data:/data
    environment:
      - TZ=America/New_York
      # Sonarr
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=2ac6994b6a224d5d84ebd4c7abd7381c
      - UN_SONARR_0_PATHS_0=/data/torrents/tv-sonarr
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_DELETE_DELAY=5m
      # Radarr
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=a63000fb63a240a8bcb5e7d750926379
      - UN_RADARR_0_PATHS_0=/data/torrents/radarr
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_DELETE_DELAY=5m
    networks:
      - web
      - services
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  web:
  services:


volumes:
